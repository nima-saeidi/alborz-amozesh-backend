upstream alborz_backend {
    server unix:/run/alborz-backend/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    # Origin certificate (the CDN in front terminates the public HTTPS)
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/ssl/alborz/origin.crt;
    ssl_certificate_key /etc/ssl/alborz/origin.key;
    server_name alborz-institute.com www.alborz-institute.com;

    server_tokens off;
    client_max_body_size 2G;

    access_log /var/log/nginx/alborz-institute.access.log;
    error_log /var/log/nginx/alborz-institute.error.log warn;

    location /static/ {
        alias /srv/alborz-backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Session videos / pdfs are never public: only through Django's signed links
    location /media/sessions/ {
        deny all;
    }

    location /media/ {
        alias /srv/alborz-backend/media/;
        expires 7d;
        access_log off;
    }

    # Internal location used by X-Accel-Redirect
    location /protected-media/ {
        internal;
        alias /srv/alborz-backend/media/;
    }

    location / {
        proxy_pass http://alborz_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
